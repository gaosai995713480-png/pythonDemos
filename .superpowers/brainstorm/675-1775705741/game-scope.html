<h2>玩法机制选择</h2>
<p class="subtitle">我们要在这个全栈大舞台上玩多花？</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="self" onclick="toggleSelect(this)">
    <div class="letter">1</div>
    <div class="content">
      <h3>单机佛系收菜 🧑‍🌾</h3>
      <p>基础循环：买种子 -> 种地 -> 等待生长 -> 浇水除虫 -> 收获金币。没有社交竞争，适合放到网页个人主页纯属挂机休闲使用。</p>
    </div>
  </div>
  
  <div class="option" data-choice="social" onclick="toggleSelect(this)">
    <div class="letter">2</div>
    <div class="content">
      <h3>经典“偷菜”互动 🥷</h3>
      <p>结合我们目前的后端 Users 表，你可以串门到别的访问者（或者伴侣）的农场里去“偷菜”或“帮忙浇水”。交互感拉满！</p>
    </div>
  </div>

  <div class="option" data-choice="weather" onclick="toggleSelect(this)">
    <div class="letter">3</div>
    <div class="content">
      <h3>天气环境系统 🌦️</h3>
      <p>随机天气（雨天自动浇水、旱天需要频繁补充水分）。给基础农场增加一些不确定性的乐趣。</p>
    </div>
  </div>
</div>

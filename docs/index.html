<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e73c7e" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>心动告白</title>
    <style>
      :root {
        --primary: #ff6b9d;
        --secondary: #c44569;
        --accent: #ffc048;
        --bg-start: #2e1437;
        --bg-end: #1a0e2e;
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text-primary: #fff;
        --text-secondary: rgba(255, 255, 255, 0.75);
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
        background-size: 400% 400%;
        animation: gradient-shift 15s ease infinite;
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(circle at 20% 50%, rgba(255, 107, 157, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(196, 69, 105, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(255, 192, 72, 0.1) 0%, transparent 50%);
        pointer-events: none;
      }

      .stage {
        position: relative;
        text-align: center;
        padding: 48px 32px;
        z-index: 2;
        max-width: 800px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(42px, 6vw, 72px);
        font-weight: 700;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 4px 20px rgba(255, 107, 157, 0.5);
        animation: title-glow 3s ease-in-out infinite;
      }

      @keyframes title-glow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.3)); }
        50% { filter: drop-shadow(0 0 25px rgba(255, 107, 157, 0.6)); }
      }

      p {
        margin: 0;
        font-size: clamp(18px, 3vw, 24px);
        opacity: 0.9;
        line-height: 1.6;
        font-weight: 300;
      }

      .heart {
        width: clamp(180px, 28vw, 280px);
        height: clamp(180px, 28vw, 280px);
        margin: 60px auto;
        position: relative;
        transform: rotate(-45deg);
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        animation: beat 1.5s ease-in-out infinite;
        box-shadow:
          0 0 60px rgba(255, 107, 157, 0.6),
          0 20px 40px rgba(0, 0, 0, 0.3),
          inset 0 -8px 16px rgba(0, 0, 0, 0.2),
          inset 0 8px 16px rgba(255, 255, 255, 0.15);
        z-index: 1;
        border-radius: 8px;
      }

      .heart::before,
      .heart::after {
        content: "";
        width: 100%;
        height: 100%;
        position: absolute;
        background: inherit;
        border-radius: 50%;
        box-shadow: inherit;
      }

      .heart::before {
        top: -50%;
        left: 0;
      }

      .heart::after {
        left: 50%;
        top: 0;
      }

      .glow-ring {
        position: absolute;
        inset: -20%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.3);
        animation: ripple 3s ease-out infinite;
        filter: blur(1px);
      }

      .floating-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .floating-heart {
        position: absolute;
        left: var(--x);
        bottom: -15vh;
        width: var(--size);
        height: var(--size);
        background: linear-gradient(135deg, rgba(255, 107, 157, 0.6), rgba(196, 69, 105, 0.4));
        transform: rotate(-45deg);
        filter: blur(1px) drop-shadow(0 0 12px rgba(255, 107, 157, 0.5));
        animation: float var(--float-duration) ease-in forwards;
        border-radius: 4px;
      }

      .floating-heart::before,
      .floating-heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: inherit;
        border-radius: 50%;
      }

      .floating-heart::before {
        top: -50%;
        left: 0;
      }

      .floating-heart::after {
        top: 0;
        left: 50%;
      }

      @keyframes beat {
        0%, 100% {
          transform: rotate(-45deg) scale(1);
        }
        50% {
          transform: rotate(-45deg) scale(1.05);
        }
      }

      @keyframes ripple {
        0% {
          opacity: 0.8;
          transform: scale(0.85);
        }
        50% {
          opacity: 0.4;
        }
        100% {
          opacity: 0;
          transform: scale(1.5);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(-45deg) scale(0.7);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        100% {
          transform: translateY(-120vh) rotate(-45deg) scale(1.4);
          opacity: 0;
        }
      }

      .signature {
        margin-top: 16px;
        font-size: clamp(16px, 2.6vw, 20px);
        letter-spacing: 1px;
        font-weight: 300;
        opacity: 0.85;
      }

      .lyrics {
        margin: 16px 0 140px;
        min-height: 32px;
        font-size: clamp(18px, 3.2vw, 26px);
        letter-spacing: 1px;
        color: var(--text-primary);
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
        position: relative;
        z-index: 3;
        font-weight: 300;
        line-height: 1.5;
        padding: 16px 24px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 1px solid var(--glass-border);
      }


      .slideshow {
        position: fixed;
        right: 32px;
        bottom: 120px;
        width: clamp(220px, 26vw, 320px);
        aspect-ratio: 3 / 4;
        padding: 12px;
        border-radius: 24px;
        background: var(--glass-bg);
        backdrop-filter: blur(30px);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        transition: transform 0.3s ease;
      }

      .slideshow:hover {
        transform: translateY(-4px);
      }

      .slideshow img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
        transition: opacity 0.6s ease;
      }

      .slideshow figcaption {
        position: absolute;
        left: 20px;
        bottom: 20px;
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        letter-spacing: 0.5px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .slideshow img.is-fading {
        opacity: 0;
      }

      .play-button {
        right: 32px;
        bottom: 32px;
        width: 64px;
        height: 64px;
        position: fixed;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        box-shadow:
          0 8px 24px rgba(255, 107, 157, 0.5),
          0 4px 12px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .play-button:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow:
          0 12px 32px rgba(255, 107, 157, 0.6),
          0 6px 16px rgba(0, 0, 0, 0.4);
      }

      .play-button:active {
        transform: translateY(-2px) scale(0.98);
      }

      .play-button::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(255, 255, 255, 0.4),
          transparent 60deg,
          transparent 300deg,
          rgba(255, 255, 255, 0.4)
        );
        opacity: 0.6;
      }

      .play-button span {
        position: relative;
        z-index: 1;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .play-button.is-playing::before {
        animation: spin 3s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .danmu-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 3;
      }

      .danmu-item {
        position: fixed;
        left: calc(100vw + 20px);
        top: 0;
        padding: 10px 18px;
        border-radius: 16px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        color: var(--text-primary);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.3px;
        white-space: nowrap;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        animation: danmu-move linear forwards;
        animation-duration: var(--duration, 12s);
        animation-delay: var(--delay, 0s);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        will-change: transform;
        pointer-events: auto;
      }

      .danmu-item:hover {
        filter: brightness(1.2);
      }

      .danmu-item.is-emoji {
        font-size: 16px;
        letter-spacing: 1px;
        box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
      }

      .danmu-item.is-fresh {
        background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(196, 69, 105, 0.2));
        border-color: rgba(255, 107, 157, 0.4);
        box-shadow:
          0 0 20px rgba(255, 107, 157, 0.5),
          0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .danmu-like {
        position: relative;
        font-size: 13px;
        color: var(--text-primary);
        opacity: 0.9;
        transition: all 0.3s ease;
      }

      .danmu-like.is-pop {
        transform: scale(1.3);
        opacity: 1;
        color: var(--accent);
      }

      @keyframes danmu-move {
        0% {
          transform: translateX(0);
          opacity: 0;
        }
        3% {
          opacity: 1;
        }
        95% {
          opacity: 1;
        }
        100% {
          transform: translateX(calc(-100vw - 100% - 40px));
          opacity: 0;
        }
      }

      .danmu-bar {
        position: fixed;
        left: 32px;
        right: 120px;
        bottom: 32px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 20px;
        background: var(--glass-bg);
        backdrop-filter: blur(30px);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        z-index: 4;
      }

      .danmu-bar input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 15px;
        color: var(--text-primary);
        outline: none;
      }

      .danmu-bar input::placeholder {
        color: var(--text-secondary);
      }

      .danmu-counter {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        min-width: 36px;
        text-align: center;
        transition: color 0.2s ease;
      }

      .danmu-bar button {
        border: none;
        padding: 8px 20px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #fff;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
      }

      .danmu-bar button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(255, 107, 157, 0.4);
      }

      .danmu-bar button:active {
        transform: translateY(0);
      }

      .danmu-settings-toggle {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 12px;
        font-size: 18px;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .danmu-settings-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .danmu-settings {
        position: fixed;
        left: 32px;
        bottom: 120px;
        width: min(320px, 86vw);
        padding: 20px 20px;
        border-radius: 20px;
        background: var(--glass-bg);
        backdrop-filter: blur(30px);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      .danmu-settings.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .danmu-settings h3 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 600;
      }

      .danmu-settings-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .danmu-settings-row span {
        width: 60px;
        opacity: 0.85;
        font-weight: 500;
      }

      .danmu-settings-row output {
        min-width: 52px;
        text-align: right;
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .danmu-settings-row input[type="range"] {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        outline: none;
        -webkit-appearance: none;
      }

      .danmu-settings-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(255, 107, 157, 0.4);
        transition: all 0.2s ease;
      }

      .danmu-settings-row input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
        box-shadow: 0 4px 12px rgba(255, 107, 157, 0.6);
      }

      .weather-card {
        position: fixed;
        left: 32px;
        top: 32px;
        padding: 20px 24px;
        border-radius: 20px;
        background: var(--glass-bg);
        backdrop-filter: blur(30px);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        z-index: 4;
        min-width: 240px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .weather-card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .weather-location {
        font-size: 14px;
        opacity: 0.85;
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }

      .weather-main {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }

      .weather-icon {
        font-size: 48px;
        line-height: 1;
      }

      .weather-temp {
        font-size: 42px;
        font-weight: 700;
        background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.8) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
      }

      .weather-desc {
        font-size: 15px;
        opacity: 0.85;
        margin-bottom: 12px;
        text-transform: capitalize;
      }

      .weather-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        font-size: 13px;
        opacity: 0.75;
      }

      .weather-detail {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .weather-loading {
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
      }

      .logout-button,
      .upload-button,
      .folder-upload-button {
        position: fixed;
        top: 32px;
        height: 44px;
        padding: 0 20px;
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.4px;
        cursor: pointer;
        z-index: 5;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .logout-button {
        right: 32px;
      }

      .upload-button {
        right: 152px;
      }

      .folder-upload-button {
        right: 292px;
      }

      .logout-button:hover,
      .upload-button:hover,
      .folder-upload-button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }

      .logout-button:active,
      .upload-button:active,
      .folder-upload-button:active {
        transform: translateY(0);
      }

      .logout-button:disabled,
      .upload-button:disabled,
      .folder-upload-button:disabled {
        cursor: not-allowed;
        opacity: 0.8;
      }

      .city-selector-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 8;
      }

      .city-selector-backdrop.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .city-selector {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) scale(0.95);
        width: min(460px, 92vw);
        max-height: 75vh;
        padding: 24px;
        border-radius: 24px;
        background: var(--glass-bg);
        backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 9;
        display: flex;
        flex-direction: column;
      }

      .city-selector.is-visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
      }

      .city-selector h3 {
        margin: 0 0 16px;
        font-size: 20px;
        font-weight: 600;
      }

      .current-location {
        padding: 10px 14px;
        margin-bottom: 12px;
        border-radius: 12px;
        background: rgba(255, 107, 157, 0.1);
        border: 1px solid rgba(255, 107, 157, 0.2);
        font-size: 13px;
        opacity: 0.9;
      }

      .city-search {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        font-size: 15px;
        margin-bottom: 16px;
        outline: none;
        transition: all 0.2s ease;
      }

      .city-search:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
      }

      .city-search::placeholder {
        color: var(--text-secondary);
      }

      .city-list {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .city-list::-webkit-scrollbar {
        width: 6px;
      }

      .city-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
      }

      .city-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }

      .city-list::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .city-item {
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        font-size: 14px;
      }

      .city-item:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(4px);
      }

      .city-item.is-active {
        background: linear-gradient(135deg, rgba(255, 107, 157, 0.2), rgba(196, 69, 105, 0.2));
        border: 1px solid rgba(255, 107, 157, 0.3);
      }

      .city-item.level-province {
        font-weight: 500;
        padding-left: 8px;
      }

      .city-item.level-city {
        padding-left: 28px;
        font-size: 13px;
      }

      .city-item.level-district {
        padding-left: 48px;
        font-size: 13px;
        opacity: 0.9;
      }

      .city-item-icon {

      function parseLrc(text) {
        const lines = text.split(/\r?\n/);
        const result = [];
        for (const line of lines) {
          // 跳过JSON格式的行（网易云音乐格式）
          if (line.trim().startsWith('{') || line.trim().startsWith('[{')) {
            continue;
          }

          // 匹配标准LRC格式: [mm:ss.xx]歌词内容
          const match = line.match(/\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)/);
          if (!match) {
            continue;
          }
          const minutes = Number(match[1]);
          const seconds = Number(match[2]);
          // 正确处理毫秒：2位除以100，3位除以1000
          let frac = 0;
          if (match[3]) {
            const raw = match[3];
            frac = raw.length >= 3 ? Number(raw) / 1000 : Number(raw.padEnd(2, "0")) / 100;
          }
          const time = minutes * 60 + seconds + frac;
          const content = match[4].trim();

          // 过滤掉空行和只有括号的行
          if (content && content !== '' && !content.match(/^[\(\)（）\s]*$/)) {
            result.push({ time, content });
          }
        }
        return result.sort((a, b) => a.time - b.time);
      }

        const cacheKey = `${adcode}_${level}`;

          return districtCache.get(cacheKey);
        }

        try {
          const url = `https://restapi.amap.com/v3/config/district?key=${AMAP_API_KEY}&keywords=${adcode}&subdistrict=1&extensions=base`;
          const response = await fetch(url);
          const data = await response.json();

          if (data.status === "1" && data.districts && data.districts.length > 0) {
            const district = data.districts[0];
            const result = {
              name: district.name,
              adcode: district.adcode,
              level: district.level,
              children: district.districts || []
            };
            districtCache.set(cacheKey, result);
            return result;

          console.error("获取行政区域失败:", err);

      // 处理点击行政区域
      async function handleDistrictClick(e) {
        const item = e.currentTarget;
        const adcode = item.dataset.adcode;
        const name = item.dataset.name;
        const level = item.dataset.level;
        const parent = item.dataset.parent;

        if (level === 'province') {
          // 点击省份，展开/收起
          if (expandedItems.has(adcode)) {
            expandedItems.delete(adcode);
          } else {
            expandedItems.clear(); // 只允许展开一个省份
            expandedItems.add(adcode);
          }
          await renderDistrictList();
        } else if (level === 'city') {
          // 点击城市，展开/收起
          if (expandedItems.has(adcode)) {
            expandedItems.delete(adcode);
          } else {
            // 保持省份展开，只展开当前城市
            const parentAdcodes = Array.from(expandedItems).filter(code => code.length === 6);
            expandedItems.clear();
            parentAdcodes.forEach(code => expandedItems.add(code));
            expandedItems.add(adcode);
          }
          await renderDistrictList();
        } else if (level === 'district') {
          // 选择区县
          // 找到对应的省市信息
          const provinceAdcode = parent.substring(0, 6) + '00';
          const cityAdcode = parent;

          // 获取省市名称
          const provinces = await loadProvinces();
          const province = provinces.find(p => p.adcode === provinceAdcode);
          const cities = await loadCities(provinceAdcode);
          const city = cities.find(c => c.adcode === cityAdcode);

          selectedDistrict = {
            province: { name: province?.name || '', adcode: provinceAdcode },
            city: { name: city?.name || '', adcode: cityAdcode },
            district: { name: name, adcode: adcode }
          };

          saveSelectedDistrict();
          hideCitySelector();
          fetchWeather();
        }
      }

      // 搜索地区
      async function searchDistrict(keyword) {
        if (!keyword.trim()) {
          await renderDistrictList();
          return;
        }

        if (!cityList) return;
        cityList.innerHTML = '<li class="loading-indicator">搜索中...</li>';

        try {
          const url = `https://restapi.amap.com/v3/config/district?key=${AMAP_API_KEY}&keywords=${encodeURIComponent(keyword)}&subdistrict=0&extensions=base`;
          const response = await fetch(url);
          const data = await response.json();

          if (data.status === "1" && data.districts && data.districts.length > 0) {
            let html = '';
            for (const district of data.districts) {
              const levelTag = district.level === 'province' ? '省' :
                               district.level === 'city' ? '市' :
                               district.level === 'district' ? '区/县' : '';

              html += `
                <li class="city-item"
                    data-adcode="${district.adcode}"
                    data-name="${district.name}"
                    data-level="${district.level}">
                  <span class="city-item-name">${district.name}</span>
                  ${levelTag ? `<span class="city-item-tag">${levelTag}</span>` : ''}
                </li>
              `;
            }

            cityList.innerHTML = html;

            // 绑定点击事件
            cityList.querySelectorAll('.city-item').forEach(item => {
              item.addEventListener('click', async () => {
                const adcode = item.dataset.adcode;
                const name = item.dataset.name;
                const level = item.dataset.level;

                // 根据级别选择
                if (level === 'district') {
                  // 直接选择区县
                  const provinceAdcode = adcode.substring(0, 2) + '0000';
                  const cityAdcode = adcode.substring(0, 4) + '00';

                  const provinces = await loadProvinces();
                  const province = provinces.find(p => p.adcode === provinceAdcode);
                  const cities = await loadCities(provinceAdcode);
                  const city = cities.find(c => c.adcode === cityAdcode);

                  selectedDistrict = {
                    province: { name: province?.name || '', adcode: provinceAdcode },
                    city: { name: city?.name || '', adcode: cityAdcode },
                    district: { name: name, adcode: adcode }
                  };
                } else if (level === 'city') {
                  // 选择城市级别
                  const provinceAdcode = adcode.substring(0, 2) + '0000';
                  const provinces = await loadProvinces();
                  const province = provinces.find(p => p.adcode === provinceAdcode);

                  selectedDistrict = {
                    province: { name: province?.name || '', adcode: provinceAdcode },
                    city: { name: name, adcode: adcode },
                    district: null
                  };
                } else if (level === 'province') {
                  // 选择省份级别
                  selectedDistrict = {
                    province: { name: name, adcode: adcode },
                    city: null,
                    district: null
                  };
                }

                saveSelectedDistrict();
                hideCitySelector();
                fetchWeather();
              });
            });
          } else {
            cityList.innerHTML = '<li class="loading-indicator">未找到相关地区</li>';
          }
        } catch (err) {
          console.error("搜索失败:", err);
          cityList.innerHTML = '<li class="loading-indicator">搜索失败，请重试</li>';
        }
      }

      function loadDanmuHistory() {
        try {
          const raw = window.localStorage.getItem(danmuStorageKey);
          const list = raw ? JSON.parse(raw) : [];
          if (Array.isArray(list)) {
            return list.filter((item) => typeof item === "string" && item.trim());
          }
        } catch (error) {}
        return [];
      }

      function saveDanmuHistory(list) {
        try {
          window.localStorage.setItem(danmuStorageKey, JSON.stringify(list));
        } catch (error) {}
      }

      function normalizeDanmuItem(raw) {
        if (!raw) {
          return null;
        }
        if (typeof raw === "string") {
          const text = raw.trim();
          if (!text) {
            return null;
          }
          return { id: null, text, likes: 0 };
        }
        if (typeof raw === "object") {
          const text = String(raw.text || raw.content || "").trim();
          if (!text) {
            return null;
          }
          const id = Number(raw.id);
          const likes = Number(raw.likes);
          return {
            id: Number.isFinite(id) ? id : null,
            text,
            likes: Number.isFinite(likes) ? Math.max(0, likes) : 0,
          };
        }
        return null;
      }

      function normalizeDanmuList(list) {
        if (!Array.isArray(list)) {
          return [];
        }
        const result = [];
        list.forEach((item) => {
          const normalized = normalizeDanmuItem(item);
          if (normalized) {
            result.push(normalized);
          }
        });
        return result;
      }

      function pickDanmuTop() {
        const height = danmuLayer ? danmuLayer.clientHeight : window.innerHeight;
        const safeTop = 120;
        const safeBottom = 160;
        const maxTop = Math.max(safeTop, height - safeBottom);
        return safeTop + Math.random() * Math.max(0, maxTop - safeTop);
      }

      function spawnDanmu(raw, delayMs = 0, options = {}) {
        if (!danmuLayer) {
          return;
        }
        const payload = normalizeDanmuItem(raw);
        if (!payload || !payload.text) {
          return;
        }
        const content = payload.text;
        const theme =
          danmuThemes[Math.floor(Math.random() * danmuThemes.length)];
        const item = document.createElement("div");
        item.className = "danmu-item";
        item.textContent = content;
        if (theme) {
          item.style.setProperty("--danmu-bg-color", theme.bg);
          item.style.setProperty("--danmu-text-color", theme.text);
          item.style.setProperty("--danmu-shadow-color", theme.shadow);
          item.style.setProperty("--danmu-accent-color", theme.accent);
        }
        if (danmuEmojiPattern.test(content)) {
          item.classList.add("is-emoji");
        }
        if (options && options.highlight) {
          item.classList.add("is-fresh");
        }
        item.style.pointerEvents = "auto";
        item.style.zIndex = "3";
        if (payload.id) {
          item.dataset.danmuId = String(payload.id);
        }
        const like = document.createElement("span");
        like.className = "danmu-like";
        let likeCount = payload.likes || 0;
        const updateLikeText = () => {
          like.textContent = likeCount > 0 ? `❤ ${likeCount}` : "❤";
        };
        const popLike = () => {
          like.classList.remove("is-pop");
          void like.offsetWidth;
          like.classList.add("is-pop");
        };
        updateLikeText();
        item.appendChild(like);
        item.addEventListener("click", (event) => {
          event.stopPropagation();
          const rawId = item.dataset.danmuId;
          const danmuId = rawId ? Number(rawId) : NaN;
          if (Number.isFinite(danmuId)) {
            postDanmuLike(danmuId).then((payload) => {
              if (payload && Number.isFinite(payload.likes)) {
                likeCount = payload.likes;
                updateLikeText();
                if (payload.liked) {
                  popLike();
                }
                return;
              }
              likeCount += 1;
              updateLikeText();
              popLike();
            });
            return;
          }
          likeCount += 1;
          updateLikeText();
          popLike();
        });
        item.style.top = `${pickDanmuTop()}px`;
        const duration =
          (10 + Math.min(content.length, 20) * 0.2 + Math.random() * 2) /
          danmuSpeedFactor;
        item.style.setProperty("--duration", `${duration}s`);
        item.style.setProperty("--delay", `${delayMs / 1000}s`);
        document.body.appendChild(item);
        item.addEventListener("animationend", () => {
          item.remove();
        });
        // 安全清除：防止 animationend 未触发导致弹幕卡屏
        setTimeout(() => { if (item.parentNode) item.remove(); }, (duration + delayMs / 1000 + 2) * 1000);
        return item;
      }

      function startDanmuLoop(list, delayMs = 0) {
        if (danmuLoopTimer) {
          window.clearInterval(danmuLoopTimer);
          danmuLoopTimer = null;
        }
        if (danmuLoopStartTimer) {
          window.clearTimeout(danmuLoopStartTimer);
          danmuLoopStartTimer = null;
        }
        danmuLoopList = normalizeDanmuList(list);
        danmuLoopIndex = 0;
        if (!danmuLoopList.length) {
          return;
        }
        const run = () => {
          danmuLoopTimer = window.setInterval(() => {
            if (!danmuLoopList.length) {
              return;
            }
            const next = danmuLoopList[danmuLoopIndex % danmuLoopList.length];
            danmuLoopIndex = (danmuLoopIndex + 1) % danmuLoopList.length;
            if (next) {
              spawnDanmu(next);
            }
          }, danmuLoopIntervalMs);
        };
        if (delayMs > 0) {
          danmuLoopStartTimer = window.setTimeout(run, delayMs);
        } else {
          run();
        }
      }

      function updateDanmuLoop(list) {
        danmuLoopList = normalizeDanmuList(list);
        if (!danmuLoopList.length) {
          danmuLoopIndex = 0;
          return;
        }
        if (danmuLoopIndex >= danmuLoopList.length) {
          danmuLoopIndex = 0;
        }
        if (!danmuLoopTimer && !danmuLoopStartTimer) {
          startDanmuLoop(danmuLoopList, 800);
        }
      }

      function fetchDanmuFromServer() {
        if (!danmuEndpoint) {
          return Promise.resolve(null);
        }
        return fetch(encodeURI(danmuEndpoint), { cache: "no-store" })
          .then((response) => (response.ok ? response.json() : null))
          .then((list) => {
            if (!Array.isArray(list)) {
              return null;
            }
            return normalizeDanmuList(list).slice(-maxDanmu);
          })
          .catch(() => null);
      }

      function postDanmuToServer(text) {
        if (!danmuEndpoint) {
          return Promise.resolve(null);
        }
        return fetch(encodeURI(danmuEndpoint), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        })
          .then((response) => (response.ok ? response.json() : null))
          .catch(() => null);
      }

      function postDanmuLike(id) {
        if (!danmuLikeEndpoint) {
          return Promise.resolve(null);
        }
        return fetch(encodeURI(danmuLikeEndpoint), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        })
          .then((response) => (response.ok ? response.json() : null))
          .then((payload) => {
            if (!payload) {
              return null;
            }
            const likes = Number(payload.likes);
            return {
              likes: Number.isFinite(likes) ? likes : null,
              liked: Boolean(payload.liked),
            };
          })
          .catch(() => null);
      }

      function initDanmu() {
        if (!danmuLayer || !danmuInput || !danmuSend) {
          return;
        }
        const renderHistory = (list) => {
          list.forEach((text, index) => {
            spawnDanmu(text, index * 900);
          });
        };
        const localHistory = normalizeDanmuList(loadDanmuHistory());
        fetchDanmuFromServer().then((serverHistory) => {
          const history =
            serverHistory && serverHistory.length ? serverHistory : localHistory;
          if (serverHistory && serverHistory.length) {
            saveDanmuHistory(history.map((item) => item.text));
          }
          renderHistory(history);
          const loopDelay = Math.min(history.length * 900, 12000);
          startDanmuLoop(history, loopDelay);
        });

        const send = () => {
          const raw = danmuInput.value.trim();
          if (!raw) {
            return;
          }
          const text = raw.slice(0, DANMU_MAX_LEN);
          danmuInput.value = "";
          updateDanmuCounter();
          const updated = loadDanmuHistory();
          updated.push(text);
          const trimmed = updated.slice(-maxDanmu);
          saveDanmuHistory(trimmed);
          const itemEl = spawnDanmu(text, 0, { highlight: true });
          updateDanmuLoop(trimmed);
          postDanmuToServer(text).then((payload) => {
            if (!payload || !itemEl) {
              return;
            }
            const id = Number(payload.id);
            const likes = Number(payload.likes);
            if (Number.isFinite(id)) {
              itemEl.dataset.danmuId = String(id);
            }
            if (Number.isFinite(likes)) {
              const likeEl = itemEl.querySelector(".danmu-like");
              if (likeEl) {
                likeEl.textContent = likes > 0 ? `❤ ${likes}` : "❤";
              }
            }
          });
        };

        danmuSend.addEventListener("click", send);
        danmuInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            send();
          }
        });
        danmuInput.addEventListener("input", updateDanmuCounter);
      }

      function updateDanmuCounter() {
        const counter = document.getElementById("danmu-counter");
        if (!counter || !danmuInput) return;
        const len = danmuInput.value.length;
        counter.textContent = `${len}/${DANMU_MAX_LEN}`;
        counter.style.color = len >= DANMU_MAX_LEN ? "var(--primary)" : "";
      }

        }
        bgm.addEventListener("play", () => {
          if (!lyricSyncRAF) lyricSyncLoop();
        });
        bgm.addEventListener("pause", () => {
          if (lyricSyncRAF) { cancelAnimationFrame(lyricSyncRAF); lyricSyncRAF = null; }
        });
        bgm.addEventListener("ended", () => {
          if (lyricSyncRAF) { cancelAnimationFrame(lyricSyncRAF); lyricSyncRAF = null; }
        });
        bgm.addEventListener("seeked", () => {
          syncLyrics(bgm.currentTime);
        });
        toggleButton.addEventListener("click", () => {
          playing = !playing;
          updateButton();
          if (playing) {
            slideshow.style.display = "";
            showPhoto(nextPhoto());

              bgm.play().then(() => { syncLyrics(bgm.currentTime); }).catch(() => {});

          return;
        }
        if (uploadButton) {
          uploadButton.disabled = true;
          uploadButton.textContent = "Uploading...";
        }
        try {
          const response = await fetch("photos/import", {

          const payload = await response.json().catch(() => ({}));

            return;

          if (!response.ok) {
            alert(payload.error || "Import failed. Please check the zip file.");

          const saved = Number(payload.saved || 0);
          const skipped = Number(payload.skipped || 0);
          alert(`成功导入 ${saved} 张照片，重复跳过 ${skipped} 张。`);
          window.location.reload();
        } catch (error) {
          alert("Import failed. Please try again.");
        } finally {
          if (uploadButton) {
            uploadButton.disabled = false;
            uploadButton.textContent = "Batch Import";
          }
          if (photoZipInput) {
            photoZipInput.value = "";
          }
        }

      async function importPhotoFiles(files) {
        if (!files || !files.length) {
          return;
        }
        const imageFiles = files.filter((file) => {
          const lowerName = (file.name || "").toLowerCase();
          return (
            lowerName.endsWith(".jpg") ||
            lowerName.endsWith(".jpeg") ||
            lowerName.endsWith(".png") ||
            lowerName.endsWith(".webp") ||
            lowerName.endsWith(".gif") ||
            lowerName.endsWith(".bmp")
          );
        });
        const ignoredCount = files.length - imageFiles.length;
        if (!imageFiles.length) {
          alert("No supported image files found in this folder.");
          return;
        }
        if (folderUploadButton) {
          folderUploadButton.disabled = true;
        }
        try {
          let savedCount = 0;
          let failedCount = 0;
          let duplicateCount = 0;
          let lastError = "";
          let authExpired = false;
          const total = imageFiles.length;
          for (let i = 0; i < total; i += 1) {
            if (authExpired) {
              break;
            }
            const file = imageFiles[i];
            if (folderUploadButton) {
              folderUploadButton.textContent = `上传中 ${i + 1}/${total} (成功 ${savedCount}, 重复 ${duplicateCount}, 失败 ${failedCount})`;
            }
            const relativeName = file.webkitRelativePath || file.name;
            const encodedName = encodeURIComponent(relativeName);
            const maxRetry = 2;
            let uploaded = false;
            for (let retry = 0; retry <= maxRetry; retry += 1) {
              try {
                const response = await fetch("photos/upload-file", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/octet-stream",
                    "X-File-Name": encodedName,
                  },
                  body: file,
                });
                const payload = await response.json().catch(() => ({}));
                if (response.status === 401) {
                  authExpired = true;
                  lastError = "Login expired.";
                  break;
                }
                if (!response.ok) {
                  if (retry < maxRetry && response.status >= 500) {
                    continue;
                  }
                  lastError = payload.error || "Folder import failed.";
                  break;
                }
                uploaded = true;
                if (payload.skipped) {
                  duplicateCount += 1;
                } else {
                  savedCount += 1;
                }
                break;
              } catch (error) {
                if (retry < maxRetry) {
                  continue;
                }
                lastError = "Network error during upload.";
              }
            }

      // ===== 5. 音频频谱可视化 =====
      const vizCanvas = document.getElementById('audio-visualizer');

      let audioContext, analyser, source, dataArray, rafId;

      function initVisualizer() {
        if (audioContext) return;
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 64;
          source = audioContext.createMediaElementSource(bgm);
          source.connect(analyser);
          analyser.connect(audioContext.destination);
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          drawViz();
        } catch(e) { console.log('Visualizer unavailable:', e); }
      }

      function drawViz() {
        rafId = requestAnimationFrame(drawViz);
        if (!analyser) return;
        analyser.getByteFrequencyData(dataArray);
        const w = vizCanvas.width = vizCanvas.offsetWidth * 2;
        const h = vizCanvas.height = vizCanvas.offsetHeight * 2;
        vizCtx.clearRect(0, 0, w, h);
        const cx = w / 2, cy = h / 2, r = Math.min(cx, cy) * 0.6;
        const bars = dataArray.length;
        for (let i = 0; i < bars; i++) {
          const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
          const val = dataArray[i] / 255;
          const barLen = val * r * 0.8 + 2;
          const x1 = cx + Math.cos(angle) * r;
          const y1 = cy + Math.sin(angle) * r;
          const x2 = cx + Math.cos(angle) * (r + barLen);
          const y2 = cy + Math.sin(angle) * (r + barLen);
          vizCtx.beginPath();
          vizCtx.moveTo(x1, y1);
          vizCtx.lineTo(x2, y2);
          vizCtx.strokeStyle = `hsla(${330 + i * 3}, 80%, ${60 + val * 30}%, ${0.4 + val * 0.5})`;
          vizCtx.lineWidth = 2;
          vizCtx.lineCap = 'round';
          vizCtx.stroke();
        }
      }

      // ===== 6. 纪念日烟花系统 =====
      const fwOverlay = document.getElementById('firework-overlay');
      const fwCanvas = document.getElementById('firework-canvas');
      const fwCtx = fwCanvas.getContext('2d');
      const fwTextEl = document.getElementById('firework-text');
      const fwCloseBtn = document.getElementById('firework-close');
      const fwTriggerBtn = document.getElementById('firework-btn');
      let fwParticles = [];
      let fwRockets = [];
      let fwRunning = false;
      let fwRAF = null;

      const FW_COLORS = [
        '#ff6b9d', '#ffc048', '#a78bfa', '#60a5fa', '#34d399',
        '#f472b6', '#fb923c', '#facc15', '#38bdf8', '#e879f9'
      ];

      class FWParticle {
        constructor(x, y, color) {
          this.x = x; this.y = y; this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.life = 1;
          this.decay = 0.012 + Math.random() * 0.015;
          this.size = 2 + Math.random() * 2;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          this.vy += 0.04; // gravity
          this.vx *= 0.98; this.vy *= 0.98;
          this.life -= this.decay;
        }
        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.life;
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      class FWRocket {
        constructor(w, h) {
          this.x = w * (0.2 + Math.random() * 0.6);
          this.y = h;
          this.targetY = h * (0.15 + Math.random() * 0.35);
          this.vy = -(6 + Math.random() * 4);
          this.color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
          this.exploded = false;
          this.trail = [];
        }
        update() {
          this.trail.push({ x: this.x, y: this.y, life: 1 });
          if (this.trail.length > 8) this.trail.shift();
          this.trail.forEach(t => t.life -= 0.12);
          this.y += this.vy;
          this.vy += 0.08;
          if (this.y <= this.targetY || this.vy >= 0) this.exploded = true;
        }
        draw(ctx) {
          this.trail.forEach(t => {
            ctx.save();
            ctx.globalAlpha = t.life * 0.5;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          });
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function fwExplode(x, y, color) {
        const count = 60 + Math.floor(Math.random() * 50);
        for (let i = 0; i < count; i++) {
          fwParticles.push(new FWParticle(x, y, color));
        }
      }

      function fwFrame() {
        fwRAF = requestAnimationFrame(fwFrame);
        const w = fwCanvas.width = fwCanvas.offsetWidth * 2;
        const h = fwCanvas.height = fwCanvas.offsetHeight * 2;
        fwCtx.fillStyle = 'rgba(0,0,0,0.15)';
        fwCtx.fillRect(0, 0, w, h);

        // Update rockets
        for (let i = fwRockets.length - 1; i >= 0; i--) {
          const r = fwRockets[i];
          r.update();
          if (r.exploded) {
            fwExplode(r.x, r.y, r.color);
            fwRockets.splice(i, 1);
          } else {
            r.draw(fwCtx);
          }
        }

        // Update particles
        for (let i = fwParticles.length - 1; i >= 0; i--) {
          const p = fwParticles[i];
          p.update();
          if (p.life <= 0) {
            fwParticles.splice(i, 1);
          } else {
            p.draw(fwCtx);
          }
        }
      }

      function launchFireworks(message, autoClose) {
        fwOverlay.style.display = '';
        fwOverlay.style.pointerEvents = 'auto';
        const textDiv = fwTextEl.querySelector('div');
        textDiv.textContent = message || '🎆';
        fwTextEl.style.opacity = '0';

        if (!fwRunning) { fwRunning = true; fwFrame(); }

        const w = window.innerWidth * 2;
        const h = window.innerHeight * 2;
        let launchCount = 0;
        const launchInterval = setInterval(() => {
          fwRockets.push(new FWRocket(w, h));
          if (Math.random() > 0.5) fwRockets.push(new FWRocket(w, h));
          launchCount++;
          if (launchCount > 20) clearInterval(launchInterval);
        }, 400);

        // Show text after 3 seconds
        setTimeout(() => { fwTextEl.style.opacity = '1'; }, 3000);

        if (autoClose) {
          setTimeout(closeFireworks, 15000);
        }
      }

      function closeFireworks() {
        fwOverlay.style.display = 'none';
        fwOverlay.style.pointerEvents = 'none';
        fwTextEl.style.opacity = '0';
        if (fwRAF) { cancelAnimationFrame(fwRAF); fwRAF = null; fwRunning = false; }
        fwParticles = []; fwRockets = [];
        fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      }

      fwCloseBtn.addEventListener('click', closeFireworks);
      fwTriggerBtn.addEventListener('click', () => launchFireworks('🎆 为你放一场烟花 🎆', false));

      // Auto-trigger on anniversary dates
      (function checkAnniversary() {
        const now = new Date();
        const m = now.getMonth() + 1;
        const d = now.getDate();
        const todayKey = `${now.getFullYear()}-${m}-${d}`;
        const fwShownKey = 'love_fw_shown_' + todayKey;

        if (localStorage.getItem(fwShownKey)) return;

        let message = '';
        if (m === 4 && d === 26) {
          message = '🎂 生日快乐，我最爱的你 🎂';
        } else if (m === 10 && d === 26) {
          message = '💕 恋爱纪念日快乐 💕';
        }

        if (message) {
          localStorage.setItem(fwShownKey, '1');
          setTimeout(() => launchFireworks(message, true), 2000);
        }
      })();

      // ===== 7. PWA 注册 =====
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>

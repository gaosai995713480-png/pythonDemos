<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>星空许愿</title>
  <style>
    :root {
      --primary: #ff6b9d; --secondary: #c44569; --accent: #ffc048;
      --glass-bg: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.18);
      --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; overflow: hidden;
      background: radial-gradient(ellipse at 20% 50%, #0d1b2a 0%, #0a0e1a 50%, #020408 100%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      cursor: crosshair;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px; padding: 16px 24px;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(20px);
    }
    .back-btn {
      text-decoration: none; color: #fff; font-size: 14px; font-weight: 600;
      padding: 8px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    }
    .top-bar h1 { font-size: 20px; font-weight: 700; }
    .top-bar .count { margin-left: auto; font-size: 13px; color: rgba(255,255,255,0.5); }
    .hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: rgba(255,255,255,0.35); z-index: 5;
      pointer-events: none; animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{ opacity:0.35 } 50%{ opacity:0.7 } }

    /* Stars */
    .sky { position: fixed; inset: 0; z-index: 1; }
    .star {
      position: absolute; z-index: 2; text-align: center; cursor: default;
      transform: translate(-50%, -50%);
    }
    .star-dot {
      width: 6px; height: 6px; border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite alternate;
      box-shadow: 0 0 8px 2px currentColor;
      margin: 0 auto 4px;
    }
    .star-text {
      font-size: 11px; color: rgba(255,255,255,0.7);
      max-width: 120px; word-break: break-all;
      opacity: 0; transition: opacity 0.3s ease;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .star:hover .star-text { opacity: 1; }
    @keyframes twinkle {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Background stars */
    .bg-star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: twinkle-bg var(--dur) ease-in-out infinite alternate;
    }
    @keyframes twinkle-bg {
      0% { opacity: 0.2; } 100% { opacity: 0.8; }
    }

    /* Shooting stars */
    .shooting-star {
      position: fixed; width: 80px; height: 1px; z-index: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
      animation: shoot 1.2s linear forwards;
      transform-origin: left center;
    }
    @keyframes shoot {
      0% { transform: translateX(0) translateY(0) rotate(-20deg); opacity: 1; }
      100% { transform: translateX(300px) translateY(120px) rotate(-20deg); opacity: 0; }
    }

    /* Input modal */
    .wish-modal {
      position: fixed; z-index: 20;
      padding: 16px; border-radius: 16px;
      background: rgba(10,14,26,0.9); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,215,0,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: all 0.3s ease;
      transform: scale(0.9);
    }
    .wish-modal.is-visible { opacity: 1; pointer-events: auto; transform: scale(1); }
    .wish-modal input {
      width: 200px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255,215,0,0.3); background: rgba(255,255,255,0.05);
      color: #ffd700; font-size: 14px; outline: none;
    }
    .wish-modal input::placeholder { color: rgba(255,215,0,0.4); }
    .wish-modal input:focus { border-color: #ffd700; }
    .wish-modal button {
      margin-top: 8px; width: 100%; padding: 6px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a0e2e; font-weight: 700; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <h1>⭐ 星空许愿</h1>
    <span class="count" id="star-count"></span>
  </div>
  <div class="sky" id="sky"></div>
  <div class="hint">✨ 点击星空，许一个心愿</div>
  <div class="wish-modal" id="wish-modal">
    <input type="text" id="wish-input" placeholder="写下你的心愿..." maxlength="50" />
    <button type="button" id="wish-submit">许愿 ⭐</button>
  </div>

  <script src="theme-switcher.js"></script>
  <script>
    const sky = document.getElementById('sky');
    const modal = document.getElementById('wish-modal');
    const wishInput = document.getElementById('wish-input');
    const wishSubmit = document.getElementById('wish-submit');
    const starCount = document.getElementById('star-count');
    let pendingPos = null;
    let allWishes = [];

    // Generate background stars
    for (let i = 0; i < 200; i++) {
      const s = document.createElement('div');
      s.className = 'bg-star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (1.5 + Math.random() * 3) + 's');
      s.style.animationDelay = (Math.random() * 3) + 's';
      sky.appendChild(s);
    }

    // Shooting stars
    function shootingStar() {
      const el = document.createElement('div');
      el.className = 'shooting-star';
      el.style.left = (Math.random() * 60 + 10) + '%';
      el.style.top = (Math.random() * 40 + 5) + '%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
    setInterval(shootingStar, 5000 + Math.random() * 8000);
    setTimeout(shootingStar, 2000);

    // Click sky to place wish
    sky.addEventListener('click', (e) => {
      if (e.target.closest('.star') || e.target.closest('.top-bar')) return;
      pendingPos = {
        x: e.clientX / window.innerWidth,
        y: e.clientY / window.innerHeight
      };
      modal.style.left = Math.min(e.clientX, window.innerWidth - 240) + 'px';
      modal.style.top = Math.min(e.clientY + 20, window.innerHeight - 100) + 'px';
      modal.classList.add('is-visible');
      wishInput.value = '';
      wishInput.focus();
    });

    wishInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitWish();
      if (e.key === 'Escape') { modal.classList.remove('is-visible'); }
    });
    wishSubmit.addEventListener('click', submitWish);

    async function submitWish() {
      const content = wishInput.value.trim();
      if (!content || !pendingPos) return;
      const colors = ['#ffd700', '#ff6b9d', '#a78bfa', '#60a5fa', '#34d399', '#f472b6'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      try {
        const res = await fetch('api/wishes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, x: pendingPos.x, y: pendingPos.y, color })
        });
        if (res.ok) {
          const data = await res.json();
          placeStar({ id: data.id, content, x: pendingPos.x, y: pendingPos.y, color });
          allWishes.push({ content, x: pendingPos.x, y: pendingPos.y, color });
          updateCount();
        }
      } catch(e) {}
      modal.classList.remove('is-visible');
      pendingPos = null;
    }

    function placeStar(wish) {
      const el = document.createElement('div');
      el.className = 'star';
      el.style.left = (wish.x * 100) + '%';
      el.style.top = (wish.y * 100) + '%';
      el.style.animationDelay = (Math.random() * 2) + 's';
      el.innerHTML = `
        <div class="star-dot" style="color:${wish.color};background:${wish.color}"></div>
        <div class="star-text">${wish.content}</div>
      `;
      sky.appendChild(el);
    }

    function updateCount() {
      starCount.textContent = `${allWishes.length} 颗星`;
    }

    async function loadWishes() {
      try {
        const res = await fetch('api/wishes');
        if (res.status === 401) { window.location.replace('login.html'); return; }
        allWishes = await res.json();
        allWishes.forEach(w => placeStar(w));
        updateCount();
      } catch(e) {}
    }

    loadWishes();
  </script>
</body>
</html>

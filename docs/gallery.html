<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>心动画廊</title>
  <style>
    :root {
      --primary: #ff6b9d; --secondary: #c44569; --accent: #ffc048;
      --glass-bg: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.18);
      --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
      --bg-grad-1: #ee7752; --bg-grad-2: #e73c7e; --bg-grad-3: #23a6d5; --bg-grad-4: #23d5ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes gradient-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    body {
      min-height: 100vh;
      background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
      background-size: 400% 400%; animation: gradient-shift 15s ease infinite;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 16px 24px;
      background: var(--glass-bg); backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
    }
    .back-btn {
      text-decoration: none; color: #fff; font-size: 14px; font-weight: 600;
      padding: 8px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.2s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .top-bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .top-bar .photo-count { font-size: 13px; color: var(--text-secondary); margin-left: auto; }
    .gallery {
      padding: 80px 24px 40px;
      column-count: 4; column-gap: 16px;
      max-width: 1400px; margin: 0 auto;
    }
    .gallery-item {
      break-inside: avoid; margin-bottom: 16px;
      border-radius: 16px; overflow: hidden; position: relative;
      background: rgba(0,0,0,0.2); cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .gallery-item img {
      width: 100%; display: block; opacity: 0;
      transition: opacity 0.5s ease;
    }
    .gallery-item img.loaded { opacity: 1; }
    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .lightbox.is-active { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 92vw; max-height: 90vh; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      transition: transform 0.3s ease;
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }
    .lightbox-counter {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 6px 16px; border-radius: 20px;
      background: rgba(0,0,0,0.5); font-size: 13px; color: rgba(255,255,255,0.8);
    }
    .empty-state {
      text-align: center; padding: 120px 24px;
      font-size: 18px; color: var(--text-secondary);
    }
    @media (max-width: 1100px) { .gallery { column-count: 3; } }
    @media (max-width: 720px) {
      .gallery { column-count: 2; padding: 72px 12px 24px; column-gap: 10px; }
      .gallery-item { margin-bottom: 10px; border-radius: 12px; }
      .top-bar { padding: 12px 16px; }
      .top-bar h1 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <h1>💕 心动画廊</h1>
    <span class="photo-count" id="photo-count"></span>
  </div>
  <div class="gallery" id="gallery"></div>
  <div class="empty-state" id="empty-state" style="display:none">还没有照片哦，快去上传吧 📸</div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="大图" />
    <button class="lightbox-nav lightbox-next" id="lb-next">›</button>
    <div class="lightbox-counter" id="lb-counter"></div>
  </div>
  <script>
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCounter = document.getElementById('lb-counter');
    const photoCountEl = document.getElementById('photo-count');
    const emptyState = document.getElementById('empty-state');
    let photos = [];
    let currentIndex = 0;

    // Load theme from localStorage
    (function applyTheme() {
      const saved = localStorage.getItem('love_theme');
      if (saved) {
        try {
          const t = JSON.parse(saved);
          if (t.vars) Object.entries(t.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
        } catch(e) {}
      }
    })();

    async function loadPhotos() {
      try {
        const res = await fetch('photos.json');
        photos = await res.json();
        if (!photos.length) { emptyState.style.display = ''; return; }
        photoCountEl.textContent = `共 ${photos.length} 张`;
        renderGallery();
      } catch(e) { emptyState.style.display = ''; }
    }

    function renderGallery() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.onload = () => img.classList.add('loaded');
            observer.unobserve(img);
          }
        });
      }, { rootMargin: '200px' });

      photos.forEach((src, i) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        const img = document.createElement('img');
        img.dataset.src = src;
        img.alt = `照片 ${i + 1}`;
        img.loading = 'lazy';
        item.appendChild(img);
        item.addEventListener('click', () => openLightbox(i));
        gallery.appendChild(item);
        observer.observe(img);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      lbImg.src = photos[index];
      lbCounter.textContent = `${index + 1} / ${photos.length}`;
      lightbox.classList.add('is-active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('is-active');
      document.body.style.overflow = '';
    }

    function navigateLB(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      lbImg.src = photos[currentIndex];
      lbCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => navigateLB(-1));
    document.getElementById('lb-next').addEventListener('click', () => navigateLB(1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('is-active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigateLB(-1);
      if (e.key === 'ArrowRight') navigateLB(1);
    });

    // Touch swipe support
    let touchStartX = 0;
    lbImg.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
    lbImg.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) navigateLB(dx > 0 ? -1 : 1);
    });

    loadPhotos();
  </script>
</body>
</html>

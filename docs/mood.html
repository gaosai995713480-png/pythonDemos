<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>心情日历</title>
  <style>
    :root {
      --primary: #ff6b9d; --secondary: #c44569; --accent: #ffc048;
      --glass-bg: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.18);
      --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
      --bg-grad-1: #ee7752; --bg-grad-2: #e73c7e; --bg-grad-3: #23a6d5; --bg-grad-4: #23d5ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes gradient-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    body {
      min-height: 100vh;
      background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
      background-size: 400% 400%; animation: gradient-shift 15s ease infinite;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px; padding: 16px 24px;
      background: var(--glass-bg); backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
    }
    .back-btn {
      text-decoration: none; color: #fff; font-size: 14px; font-weight: 600;
      padding: 8px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.2s ease;
    }
    .back-btn:hover { background: rgba(255,255,255,0.18); }
    .top-bar h1 { font-size: 20px; font-weight: 700; }

    .container { max-width: 700px; margin: 0 auto; padding: 90px 20px 60px; }

    /* Stats */
    .stats {
      display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .stat-card {
      flex: 1; min-width: 120px; padding: 18px; border-radius: 16px;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); text-align: center;
    }
    .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    /* Calendar */
    .cal-header {
      display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px;
    }
    .cal-header button {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.1); color: #fff; font-size: 18px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .cal-header button:hover { background: rgba(255,255,255,0.2); }
    .cal-header .month-label { font-size: 20px; font-weight: 700; min-width: 140px; text-align: center; }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
      padding: 20px; border-radius: 20px;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }
    .cal-grid .weekday {
      text-align: center; font-size: 12px; color: var(--text-secondary);
      font-weight: 600; padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      font-size: 13px; cursor: pointer; transition: all 0.2s ease;
      background: rgba(255,255,255,0.03); position: relative;
    }
    .cal-day:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
    .cal-day.is-today {
      border: 2px solid var(--primary);
      box-shadow: 0 0 12px rgba(255,107,157,0.3);
    }
    .cal-day.has-mood { font-weight: 600; }
    .cal-day .emoji { font-size: 18px; line-height: 1; }
    .cal-day .day-num { font-size: 11px; color: var(--text-secondary); }
    .cal-day.is-empty { pointer-events: none; background: transparent; }
    /* Mood levels — color coding */
    .cal-day.level-1 { background: rgba(100,130,180,0.35); }
    .cal-day.level-2 { background: rgba(150,160,200,0.3); }
    .cal-day.level-3 { background: rgba(200,180,150,0.3); }
    .cal-day.level-4 { background: rgba(255,160,130,0.3); }
    .cal-day.level-5 { background: rgba(255,107,157,0.4); box-shadow: 0 0 8px rgba(255,107,157,0.2); }

    /* Mood Picker Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-backdrop.is-visible { opacity: 1; pointer-events: auto; }
    .modal {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.95);
      width: min(400px, 92vw); padding: 28px; border-radius: 24px;
      background: var(--glass-bg); backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      z-index: 21; opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      text-align: center;
    }
    .modal.is-visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .modal .date-info { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .emoji-picker { display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .emoji-option {
      width: 52px; height: 52px; border-radius: 14px; border: 2px solid transparent;
      background: rgba(255,255,255,0.06); font-size: 26px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .emoji-option:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }
    .emoji-option.is-selected { border-color: var(--primary); background: rgba(255,107,157,0.15); }
    .level-picker { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .level-picker label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .level-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 2px solid transparent;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .level-btn:hover { transform: scale(1.1); }
    .level-btn.is-selected { border-color: #fff; }
    .level-btn[data-level="1"] { background: rgba(100,130,180,0.5); color: #fff; }
    .level-btn[data-level="2"] { background: rgba(150,160,200,0.5); color: #fff; }
    .level-btn[data-level="3"] { background: rgba(200,180,150,0.5); color: #fff; }
    .level-btn[data-level="4"] { background: rgba(255,160,130,0.5); color: #fff; }
    .level-btn[data-level="5"] { background: rgba(255,107,157,0.6); color: #fff; }
    .note-input {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06);
      color: #fff; font-size: 14px; outline: none; margin-bottom: 16px;
    }
    .note-input:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button {
      flex: 1; padding: 10px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff;
    }
    .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }

    @media (max-width: 720px) {
      .top-bar { padding: 12px 16px; }
      .cal-grid { padding: 14px; gap: 6px; }
      .cal-day .emoji { font-size: 15px; }
      .container { padding: 72px 12px 40px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <h1>😊 心情日历</h1>
  </div>

  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="cal-header">
      <button id="prev-month">‹</button>
      <span class="month-label" id="month-label"></span>
      <button id="next-month">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" id="modal">
    <h2>今天心情如何？</h2>
    <div class="date-info" id="modal-date"></div>
    <div class="emoji-picker" id="emoji-picker"></div>
    <div>
      <label style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;display:block">心情等级</label>
      <div class="level-picker" id="level-picker"></div>
    </div>
    <input class="note-input" id="note-input" placeholder="一句话记录今天..." maxlength="200" />
    <div class="modal-actions">
      <button class="btn-cancel" id="m-cancel">取消</button>
      <button class="btn-primary" id="m-save">打卡</button>
    </div>
  </div>

  <script src="theme-switcher.js"></script>
  <script>
    const MOODS = ['😆','😊','😌','😐','😢','😤','🥰','😴','🤔','🎉'];
    const LEVEL_LABELS = ['低落','一般','还行','开心','超开心'];
    let currentYear, currentMonth;
    let moodData = {};
    let selectedDate = '';
    let selectedEmoji = '😊';
    let selectedLevel = 3;


    function init() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;
      buildEmojiPicker();
      buildLevelPicker();
      loadMonth();
    }

    function buildEmojiPicker() {
      const picker = document.getElementById('emoji-picker');
      MOODS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.className = 'emoji-option';
        btn.textContent = emoji;
        btn.addEventListener('click', () => {
          selectedEmoji = emoji;
          picker.querySelectorAll('.emoji-option').forEach(b => b.classList.remove('is-selected'));
          btn.classList.add('is-selected');
        });
        picker.appendChild(btn);
      });
    }

    function buildLevelPicker() {
      const picker = document.getElementById('level-picker');
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.dataset.level = i;
        btn.textContent = i;
        btn.title = LEVEL_LABELS[i - 1];
        if (i === 3) btn.classList.add('is-selected');
        btn.addEventListener('click', () => {
          selectedLevel = i;
          picker.querySelectorAll('.level-btn').forEach(b => b.classList.remove('is-selected'));
          btn.classList.add('is-selected');
        });
        picker.appendChild(btn);
      }
    }

    async function loadMonth() {
      document.getElementById('month-label').textContent = `${currentYear}年${currentMonth}月`;
      try {
        const res = await fetch(`api/mood?year=${currentYear}&month=${currentMonth}`);
        if (res.status === 401) { window.location.replace('login.html'); return; }
        const items = await res.json();
        moodData = {};
        items.forEach(item => { moodData[item.mood_date] = item; });
      } catch(e) { moodData = {}; }
      renderCalendar();
      renderStats();
    }

    function renderCalendar() {
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';
      const weekdays = ['日','一','二','三','四','五','六'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = w;
        grid.appendChild(el);
      });
      const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      // Empty cells
      for (let i = 0; i < firstDay; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day is-empty';
        grid.appendChild(el);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const el = document.createElement('div');
        el.className = 'cal-day';
        if (dateStr === todayStr) el.classList.add('is-today');
        const mood = moodData[dateStr];
        if (mood) {
          el.classList.add('has-mood', `level-${mood.level}`);
          el.innerHTML = `<span class="emoji">${mood.emoji}</span><span class="day-num">${d}</span>`;
        } else {
          el.innerHTML = `<span class="day-num" style="font-size:14px">${d}</span>`;
        }
        el.addEventListener('click', () => openMoodPicker(dateStr, mood));
        grid.appendChild(el);
      }
    }

    function renderStats() {
      const stats = document.getElementById('stats');
      const entries = Object.values(moodData);
      const count = entries.length;
      const avgLevel = count ? (entries.reduce((s, e) => s + e.level, 0) / count).toFixed(1) : '-';
      // Most used emoji
      const emojiCount = {};
      entries.forEach(e => { emojiCount[e.emoji] = (emojiCount[e.emoji] || 0) + 1; });
      const topEmoji = Object.entries(emojiCount).sort((a,b) => b[1] - a[1])[0];
      stats.innerHTML = `
        <div class="stat-card"><div class="label">打卡天数</div><div class="value">${count}</div></div>
        <div class="stat-card"><div class="label">平均心情</div><div class="value">${avgLevel}</div><div class="sub">${count ? LEVEL_LABELS[Math.round(avgLevel) - 1] || '' : ''}</div></div>
        <div class="stat-card"><div class="label">最常心情</div><div class="value">${topEmoji ? topEmoji[0] : '-'}</div><div class="sub">${topEmoji ? topEmoji[1] + '次' : ''}</div></div>
      `;
    }

    function openMoodPicker(dateStr, existing) {
      selectedDate = dateStr;
      selectedEmoji = existing ? existing.emoji : '😊';
      selectedLevel = existing ? existing.level : 3;
      document.getElementById('modal-date').textContent = dateStr;
      document.getElementById('note-input').value = existing ? (existing.note || '') : '';
      // Highlight selected emoji
      const picker = document.getElementById('emoji-picker');
      picker.querySelectorAll('.emoji-option').forEach(b => {
        b.classList.toggle('is-selected', b.textContent === selectedEmoji);
      });
      // Highlight level
      const lpicker = document.getElementById('level-picker');
      lpicker.querySelectorAll('.level-btn').forEach(b => {
        b.classList.toggle('is-selected', parseInt(b.dataset.level) === selectedLevel);
      });
      document.getElementById('modal').classList.add('is-visible');
      document.getElementById('modal-backdrop').classList.add('is-visible');
    }

    function hideModal() {
      document.getElementById('modal').classList.remove('is-visible');
      document.getElementById('modal-backdrop').classList.remove('is-visible');
    }

    document.getElementById('m-cancel').addEventListener('click', hideModal);
    document.getElementById('modal-backdrop').addEventListener('click', hideModal);

    document.getElementById('m-save').addEventListener('click', async () => {
      const note = document.getElementById('note-input').value.trim();
      try {
        const res = await fetch('api/mood', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mood_date: selectedDate, emoji: selectedEmoji, note, level: selectedLevel })
        });
        if (res.status === 401) { window.location.replace('login.html'); return; }
        if (!res.ok) { alert('保存失败'); return; }
        hideModal();
        loadMonth();
      } catch(e) { alert('网络错误'); }
    });

    document.getElementById('prev-month').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      loadMonth();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      loadMonth();
    });

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>表白信</title>
  <style>
    :root {
      --primary: #ff6b9d; --secondary: #c44569; --accent: #ffc048;
      --glass-bg: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.18);
      --text-primary: #fff; --text-secondary: rgba(255,255,255,0.75);
      --bg-grad-1: #ee7752; --bg-grad-2: #e73c7e; --bg-grad-3: #23a6d5; --bg-grad-4: #23d5ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @keyframes gradient-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
      background-size: 400% 400%; animation: gradient-shift 15s ease infinite;
      color: var(--text-primary);
      font-family: "Georgia", "Songti SC", "STSong", serif;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 16px; padding: 16px 24px;
      background: var(--glass-bg); backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--glass-border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .back-btn {
      text-decoration: none; color: #fff; font-size: 14px; font-weight: 600;
      padding: 8px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    }
    .top-bar h1 { font-size: 20px; font-weight: 700; }
    .replay-btn {
      margin-left: auto; padding: 8px 16px; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 13px; cursor: pointer; font-family: inherit;
    }

    .letter-wrap {
      max-width: 640px; width: 90%; margin: 100px auto 60px; padding: 40px;
      background: var(--glass-bg); backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .letter-date {
      font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;
      font-family: -apple-system, sans-serif;
    }
    .letter-salutation {
      font-size: 22px; font-weight: 700; margin-bottom: 24px;
      color: var(--accent);
    }
    .letter-body {
      font-size: 17px; line-height: 2; color: rgba(255,255,255,0.9);
      min-height: 200px; white-space: pre-wrap;
    }
    .letter-body .cursor {
      display: inline-block; width: 2px; height: 1.2em; background: var(--accent);
      vertical-align: text-bottom; margin-left: 2px;
      animation: blink 0.6s ease-in-out infinite alternate;
    }
    @keyframes blink { 0%{ opacity:1 } 100%{ opacity:0 } }
    .letter-sign {
      margin-top: 30px; text-align: right; font-size: 16px;
      color: var(--primary); font-style: italic;
      opacity: 0; transition: opacity 1s ease;
    }
    .letter-sign.is-visible { opacity: 1; }
    .letter-seal {
      position: absolute; right: 24px; top: 24px; font-size: 36px;
      opacity: 0.3;
    }

    /* Letter selector */
    .letter-nav {
      display: flex; gap: 8px; margin: 0 auto 20px; max-width: 640px; width: 90%;
      justify-content: center; flex-wrap: wrap;
    }
    .letter-tab {
      padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
      background: transparent; color: var(--text-secondary);
      font-size: 13px; cursor: pointer; font-family: -apple-system, sans-serif;
    }
    .letter-tab.is-active { background: rgba(255,255,255,0.15); color: #fff; border-color: var(--primary); }

    @media (max-width: 720px) {
      .letter-wrap { margin: 80px auto 40px; padding: 28px 24px; }
      .letter-body { font-size: 15px; line-height: 1.9; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 返回</a>
    <h1>💌 表白信</h1>
    <button class="replay-btn" id="replay-btn">重新播放 ↻</button>
  </div>

  <div class="letter-nav" id="letter-nav"></div>

  <div class="letter-wrap">
    <div class="letter-seal">💕</div>
    <div class="letter-date" id="letter-date"></div>
    <div class="letter-salutation" id="letter-salutation"></div>
    <div class="letter-body" id="letter-body"></div>
    <div class="letter-sign" id="letter-sign"></div>
  </div>

  <script src="theme-switcher.js"></script>
  <script>

    const LETTERS = [
      {
        title: '第一封信',
        date: '写于心动的那一天',
        salutation: '亲爱的路路：',
        body: `你好呀，是我。

当你看到这封信的时候，我可能正在某个角落里偷偷想你。

还记得我们第一次见面吗？那天的阳光刚刚好，你笑起来的样子像极了春天里最温柔的风。从那一刻起，我的世界就多了一种颜色——是你的颜色。

我不太会说那些甜到腻的情话，但我想让你知道：

遇见你之前，我从来不知道"心动"是什么感觉。
遇见你之后，我才明白，原来一个人对另一个人的喜欢，可以是一瞬间的事，也可以是一辈子的事。

你的每一个表情我都想好好记住。
你开心的时候，我的整个世界都在发光。
你难过的时候，我恨不得把所有温柔都给你。

谢谢你出现在我的生命里。
谢谢你让平凡的日子变得值得期待。
谢谢你成为我心里最柔软的那个角落。

往后的日子，我想慢慢地、认真地，和你一起走。无论是阳光灿烂的日子，还是风雨交加的夜晚，我都想站在你身边，做你最坚定的依靠。`,
        sign: '永远为你心动的人'
      },
      {
        title: '给未来的你',
        date: '写于某个想你的深夜',
        salutation: '致最特别的你：',
        body: `夜深了，窗外的月光很温柔，像你的眼睛。

今天突然很想你，想你笑起来嘴角弯弯的样子，想你撒娇时故意嘟嘴的模样，想你认真做事时专注的侧脸。

你知道吗？

和你在一起的每一天，我都觉得自己是这个世界上最幸运的人。

有人说喜欢是一阵风，来得快也去得快。
可是我对你的喜欢，像是种在心里的树。
每一天都在生长，每一天都更加枝繁叶茂。

我想象过很多关于未来的画面：

我们一起去看海，让浪花打湿你的裙摆。
我们一起走过四季，春天赏花、夏天听蝉、秋天踩落叶、冬天围炉吃火锅。
我们一起变老，即使满头白发也要手牵手散步。

这些画面里，每一帧都有你。

所以，请你也要好好的。
好好吃饭，好好睡觉，好好笑。
因为你好了，我的全世界就都好了。`,
        sign: '最爱你的人'
      },
      {
        title: '生日快乐',
        date: '写于你的专属日子',
        salutation: '我最珍贵的宝贝：',
        body: `今天是你的生日，是这个世界上最重要的日子。

因为这一天，你来到了这个世界。
因为你来到了这个世界，我才有了遇见你的可能。
因为遇见了你，我的人生才有了心动的故事。

所以今天，我要对全世界说：
谢谢这个世界送给我的最好的礼物——你。

生日快乐，我的女孩。

愿你的每一个愿望都能实现。
愿你永远被温柔以待。
愿你的笑容永远灿烂如花。
愿你的眼里永远有星星。

而我会做那个，
永远站在你身后为你鼓掌的人，
永远在你需要时第一个出现的人，
永远把你放在心尖最柔软的地方的人。

今天你是小公主，
以后的每一天你也是。

我爱你，不止在今天。`,
        sign: '你的专属守护者'
      }
    ];

    let currentLetter = 0;
    let typingTimer = null;
    let typing = false;

    const bodyEl = document.getElementById('letter-body');
    const dateEl = document.getElementById('letter-date');
    const salutationEl = document.getElementById('letter-salutation');
    const signEl = document.getElementById('letter-sign');
    const navEl = document.getElementById('letter-nav');
    const replayBtn = document.getElementById('replay-btn');

    // Build nav tabs
    LETTERS.forEach((l, i) => {
      const tab = document.createElement('button');
      tab.className = 'letter-tab';
      tab.textContent = l.title;
      tab.addEventListener('click', () => {
        if (typing && i === currentLetter) return;
        currentLetter = i;
        playLetter(i);
      });
      navEl.appendChild(tab);
    });

    // Typing sound using Web Audio API
    let audioCtx;
    function typeSound() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { return; }
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600 + Math.random() * 400, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playLetter(index) {
      if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
      typing = true;
      const letter = LETTERS[index];
      dateEl.textContent = letter.date;
      salutationEl.textContent = letter.salutation;
      signEl.textContent = '— ' + letter.sign;
      signEl.classList.remove('is-visible');
      bodyEl.innerHTML = '<span class="cursor"></span>';

      // Update active tab
      navEl.querySelectorAll('.letter-tab').forEach((t, i) => {
        t.classList.toggle('is-active', i === index);
      });

      const text = letter.body;
      let charIndex = 0;

      function typeNext() {
        if (charIndex >= text.length) {
          // Remove cursor, show signature
          const cursor = bodyEl.querySelector('.cursor');
          if (cursor) cursor.remove();
          signEl.classList.add('is-visible');
          typing = false;
          return;
        }
        const char = text[charIndex];
        const cursor = bodyEl.querySelector('.cursor');
        const textNode = document.createTextNode(char);
        bodyEl.insertBefore(textNode, cursor);

        // Play sound for non-whitespace
        if (char.trim()) typeSound();

        charIndex++;
        // Variable speed: pause longer on punctuation
        let delay = 55;
        if ('，。！？、；：'.includes(char)) delay = 300;
        else if ('。！？'.includes(char)) delay = 500;
        else if (char === '\n') delay = 200;

        typingTimer = setTimeout(typeNext, delay);
      }

      typingTimer = setTimeout(typeNext, 500);
    }

    replayBtn.addEventListener('click', () => playLetter(currentLetter));

    // Start first letter
    playLetter(0);
  </script>
</body>
</html>
